<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant PDF Password Remover</title>
    
    <!-- Using the high-speed distribution version of pdf-lib -->
    <script src="https://jsdelivr.net"></script>
    
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .app-container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 420px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        h2 { margin-top: 0; color: #0f172a; font-size: 24px; font-weight: 700; }
        p { color: #64748b; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 13px; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="file"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #f8fafc;
            transition: all 0.2s;
        }
        input:focus { outline: none; border-color: #2563eb; background-color: #ffffff; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
        button {
            width: 100%;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        button:hover { background-color: #1d4ed8; }
        button:disabled { background-color: #93c5fd; cursor: not-allowed; }
        #status-display {
            margin-top: 20px;
            font-size: 14px;
            font-weight: 500;
            padding: 12px;
            border-radius: 8px;
            line-height: 1.4;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
        }
        .error { background-color: #fee2e2 !important; color: #b91c1c !important; border-color: #fca5a5 !important; }
        .success { background-color: #dcfce7 !important; color: #15803d !important; border-color: #86efac !important; }
        .processing { background-color: #e0f2fe !important; color: #0369a1 !important; border-color: #7dd3fc !important; }
    </style>
</head>
<body>

<div class="app-container">
    <h2>Instant PDF Unlocker</h2>
    <p>High-speed, client-side cryptographic decryption module for professional deployment.</p>
    
    <div class="input-group">
        <label for="pdfFile">Select Protected File</label>
        <input type="file" id="pdfFile" accept=".pdf">
    </div>
    
    <div class="input-group">
        <label for="pdfPassword">File Password</label>
        <input type="password" id="pdfPassword" placeholder="Enter password to unlock...">
    </div>
    
    <button id="submitBtn">Remove Password Instantly</button>
    
    <div id="status-display">System Status: Awaiting Action...</div>
</div>

<script>
    document.getElementById('submitBtn').addEventListener('click', async () => {
        const fileInput = document.getElementById('pdfFile');
        const passwordInput = document.getElementById('pdfPassword');
        const statusDisplay = document.getElementById('status-display');
        const submitBtn = document.getElementById('submitBtn');
        
        if (!fileInput.files.length) {
            updateStatus("Please select a valid PDF file first.", "error");
            return;
        }

        updateStatus("Decrypting cryptographic keys...", "processing");
        submitBtn.disabled = true;

        try {
            const file = fileInput.files[0];
            const fileBuffer = await file.arrayBuffer();
            
            // OPTIMIZATION: Load the PDF structure directly into binary registers
            // By passing 'ignoreEncryption: false', pdf-lib handles internal structural parsing immediately
            const pdfDoc = await PDFLib.PDFDocument.load(fileBuffer, { 
                password: passwordInput.value,
                ignoreEncryption: false
            });
            
            updateStatus("Stripping security parameters...", "processing");
            
            // OPTIMIZATION: Create an entirely flat memory buffer clone 
            // Instead of rendering to images, we clone array elements directly, omitting the encryption dictionaries.
            const decoupledDoc = await PDFLib.PDFDocument.create();
            const indices = pdfDoc.getPageIndices();
            const clonedPages = await decoupledDoc.copyPages(pdfDoc, indices);
            clonedPages.forEach(page => decoupledDoc.addPage(page));
            
            // Save out the structural array bytes natively
            const rawBytes = await decoupledDoc.save();
            
            // Stream raw bytes directly to browser client pipeline
            const dataBlob = new Blob([rawBytes], { type: 'application/pdf' });
            const downloadAnchor = document.createElement('a');
            downloadAnchor.href = URL.createObjectURL(dataBlob);
            downloadAnchor.download = file.name.replace('.pdf', '_unlocked.pdf');
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            document.body.removeChild(downloadAnchor);
            
            updateStatus("Success! Encryption keys dropped completely.", "success");
        } catch (err) {
            console.error(err);
            updateStatus("Decryption Failed. Verify your password or confirm if this file uses unsupported custom security wrappers.", "error");
        } finally {
            submitBtn.disabled = false;
        }
    });

    function updateStatus(text, statusClass) {
        const statusDisplay = document.getElementById('status-display');
        statusDisplay.innerText = text;
        statusDisplay.className = statusClass;
    }
</script>

</body>
</html>
